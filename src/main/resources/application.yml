spring:
    datasource:
        url: jdbc:h2:file:./data/testdb
        driver-class-name: org.h2.Driver
        username: oi
        password:
    h2:
        console:
            enabled: true
            path: /h2-console
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: update
        show-sql: true
    flyway:
        enabled: true